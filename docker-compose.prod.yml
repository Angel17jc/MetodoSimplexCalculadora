# Producción (servidor de la facultad)
#
# Sin base de datos:  docker compose -f docker-compose.prod.yml up -d --build
# Con base de datos:  docker compose -f docker-compose.prod.yml --profile db up -d --build
#
# Guía completa: docs/despliegue.md
name: simplex

services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./backend
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
      --proxy-headers --forwarded-allow-ips=*
    env_file:
      - path: .env
        required: false
    environment:
      ENTORNO: produccion
    depends_on:
      migraciones:
        condition: service_completed_successfully
        required: false
    restart: unless-stopped

  migraciones:
    profiles: ["db"]
    build: ./backend
    command: alembic upgrade head
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy

  db:
    profiles: ["db"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simplex}
      # Obligatoria con --profile db: PostgreSQL no arranca sin clave.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-simplex}
    volumes:
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  datos_db:
